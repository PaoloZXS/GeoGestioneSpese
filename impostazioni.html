<!doctype html>

  <head>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <style>
      .page-wrapper {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .placeholder-icon {
        font-size: 80px;
        color: var(--text-muted);
        margin-bottom: 20px;
        opacity: 0.5;
      }
      .placeholder-title {
        font-size: 28px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 10px;
      }
      .placeholder-desc {
        font-size: 16px;
        color: var(--text-secondary);
        max-width: 400px;
        line-height: 1.6;
      }
      .placeholder-btn {
        margin-top: 24px;
        padding: 12px 32px;
        background: var(--red);
        color: white;
        border: none;
        border-radius: 30px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
      }
      .placeholder-btn:hover {
        background: var(--red-hover);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <script>if(sessionStorage.getItem("auth")!=="true"){window.location.replace("login.html")}</script>
    <!-- SIDEBAR -->
    <aside class="sidebar">

      <nav>

        >
        <a onclick="location.href = 'statistiche.html'"

        >
        <a onclick="location.href = 'categorie.html'"

        >
        <a class="active" onclick="location.href = 'impostazioni.html'"
          ><i class="fas fa-cog"></i> Impostazioni</a
        >
      </nav>
      <div class="bottom">
        <a href="#" onclick="sessionStorage.clear();window.location.replace('login.html')"
          ><i class="fas fa-sign-out-alt"></i> Esci</a
        >
      </div>

    <div class="main">

        </div>
        <button
          class="placeholder-btn"
          onclick="
            if (
              confirm('Resettare tutti i dati? I dati attuali andranno persi.')
            ) {
              localStorage.clear();
              alert('Dati resettati. Ricarica la pagina.');
            }
          "
        >

        </button>
