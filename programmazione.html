<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programmazione · Gestione Spese</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/notifications.css" />
    <link rel="stylesheet" href="css/programmazione.css" />
    <style>
      .page-wrapper {
        overflow-y: auto;
      }
      .page-wrapper h2 {
        font-size: 22px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .page-wrapper h2 i {
        color: var(--blue);
        font-size: 26px;
      }
    </style>
  </head>
  <body>
    <script>if(sessionStorage.getItem("auth")!=="true"){window.location.replace("login.html")}</script>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fas fa-coins"></i>
        <span>spese</span>
      </div>
      <nav>
        <a onclick="location.href = 'index.html'"
          ><i class="fas fa-home"></i> Planning</a
        >
        <a class="active" onclick="location.href = 'programmazione.html'"
          ><i class="fas fa-redo"></i> Ricorrenti</a
        >
        <a onclick="location.href = 'statistiche.html'"
          ><i class="fas fa-chart-pie"></i> Report</a
        >
        <a onclick="location.href = 'categorie.html'"
          ><i class="fas fa-tag"></i> Categorie</a
        >
        <a onclick="location.href = 'impostazioni.html'"
          ><i class="fas fa-cog"></i> Impostazioni</a
        >
      </nav>
      <div class="bottom">
        <a href="#" onclick="sessionStorage.clear();window.location.replace('login.html')"
          ><i class="fas fa-sign-out-alt"></i> Esci</a
        >
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <div class="top-bar">
        <h2><i class="fas fa-redo"></i> Programmazione</h2>
        <div></div>
      </div>
      <div class="page-wrapper">
        <h2><i class="fas fa-calendar-alt"></i> Gestione voci ricorrenti</h2>

        <!-- Form inserimento ricorrente -->
        <div class="programmazione-form entrate-mode">
          <div class="field-group">
            <label>Tipo</label>
            <select id="ricTipo">
              <option value="entrate">Entrata</option>
              <option value="uscite">Uscita</option>
            </select>
          </div>
          <div class="field-group">
            <label>Descrizione</label>
            <select id="ricDesc">
              <option value="">Seleziona prima il Tipo...</option>
            </select>
          </div>
          <div class="field-group">
            <label>Importo (€)</label>
            <input
              type="number"
              id="ricImporto"
              placeholder="0.00"
              step="0.01"
              min="0"
            />
          </div>
          <div class="field-group">
            <label>Da (mese/anno)</label>
            <input type="month" id="ricDataInizio" />
          </div>
          <div class="field-group">
            <label>A (mese/anno)</label>
            <input type="month" id="ricDataFine" />
          </div>
          <div class="btn-ric-group">
            <button class="btn-add-ric" id="addRicorrenteBtn">
              <i class="fas fa-plus"></i> Aggiungi
            </button>
            <button
              class="btn-cancel-ric"
              id="cancelRicBtn"
              style="display: none"
            >
              <i class="fas fa-times"></i> Annulla
            </button>
            <button
              class="btn-delete-ric"
              id="deleteRicBtn"
              style="display: none"
            >
              <i class="fas fa-trash"></i> Elimina
            </button>
          </div>
        </div>

        <!-- Colonne ricorrenti -->
        <div class="ricorrenti-grid">
          <div class="programmazione-column entrate">
            <h4>
              <i class="fas fa-arrow-up" style="color: #16a34a"></i> Entrate
            </h4>
            <div class="ricorrenti-list" id="ricListEntrate"></div>
          </div>
          <div class="programmazione-column uscite">
            <h4>
              <i class="fas fa-arrow-down" style="color: #dc2626"></i> Uscite
            </h4>
            <div class="ricorrenti-list" id="ricListUscite"></div>
          </div>
        </div>

        <!-- Pulsanti azione -->
        <div class="programmazione-actions">
          <a
            href="index.html"
            class="btn-close-ric"
            style="
              text-decoration: none;
              padding: 9px 24px;
              border-radius: 30px;
              font-weight: 600;
              font-size: 14px;
              background: #e9edf2;
              color: var(--text-dark);
              display: inline-block;
            "
            ><i class="fas fa-arrow-left"></i> Planning</a
          >
          <button class="btn-apply" id="applyRicBtn">
            <i class="fas fa-check"></i> Salva e applica
          </button>
        </div>
      </div>
    </div>

    <!-- NOTIFICA PERSONALIZZATA -->
    <div class="notifica-overlay" id="notificaModal">
      <div class="notifica-box">
        <span class="notifica-icon" id="notificaIcon"
          ><i class="fas fa-exclamation-circle"></i
        ></span>
        <div class="notifica-msg" id="notificaMsg"></div>
        <div class="notifica-btns" id="notificaBtns"></div>
      </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/programmazione.js"></script>
  </body>
</html>
