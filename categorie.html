<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorie Â· Gestione Spese</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/notifications.css" />
    <link rel="stylesheet" href="css/categorie.css" />
    <style>
      .page-wrapper {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .page-wrapper h2 {
        font-size: 22px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .page-wrapper h2 i {
        color: var(--blue);
        font-size: 26px;
      }
    </style>
  </head>
  <body>
    <script>if(sessionStorage.getItem("auth")!=="true"){window.location.replace("login.html")}</script>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fas fa-coins"></i>
        <span>spese</span>
      </div>
      <nav>
        <a onclick="location.href = 'index.html'"
          ><i class="fas fa-home"></i> Planning</a
        >
        <a onclick="location.href = 'programmazione.html'"
          ><i class="fas fa-redo"></i> Ricorrenti</a
        >
        <a onclick="location.href = 'statistiche.html'"
          ><i class="fas fa-chart-pie"></i> Report</a
        >
        <a class="active" onclick="location.href = 'categorie.html'"
          ><i class="fas fa-tag"></i> Categorie</a
        >
        <a onclick="location.href = 'impostazioni.html'"
          ><i class="fas fa-cog"></i> Impostazioni</a
        >
      </nav>
      <div class="bottom">
        <a href="#" onclick="sessionStorage.clear();window.location.replace('login.html')"
          ><i class="fas fa-sign-out-alt"></i> Esci</a
        >
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <div class="top-bar">
        <h2><i class="fas fa-tag"></i> Categorie</h2>
        <div></div>
      </div>
      <div class="page-wrapper">
        <h2><i class="fas fa-list"></i> Gestione categorie</h2>

        <div class="categorie-grid">
          <!-- Colonna Entrate (verde) -->
          <div class="categorie-column entrate">
            <h4>
              <i class="fas fa-arrow-up" style="color: #16a34a"></i> Entrate
            </h4>
            <div class="categorie-list" id="catListEntrate"></div>
            <div class="categorie-add-form">
              <input
                type="text"
                id="catInputEntrate"
                placeholder="Nuova categoria entrata..."
              />
              <button class="btn-add-cat entrate" data-tipo="entrate">
                <i class="fas fa-plus"></i> Aggiungi
              </button>
            </div>
          </div>
          <!-- Colonna Uscite (rossa) -->
          <div class="categorie-column uscite">
            <h4>
              <i class="fas fa-arrow-down" style="color: #dc2626"></i> Uscite
            </h4>
            <div class="categorie-list" id="catListUscite"></div>
            <div class="categorie-add-form">
              <input
                type="text"
                id="catInputUscite"
                placeholder="Nuova categoria uscita..."
              />
              <button class="btn-add-cat uscite" data-tipo="uscite">
                <i class="fas fa-plus"></i> Aggiungi
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- NOTIFICA PERSONALIZZATA -->
    <div class="notifica-overlay" id="notificaModal">
      <div class="notifica-box">
        <span class="notifica-icon" id="notificaIcon"
          ><i class="fas fa-exclamation-circle"></i
        ></span>
        <div class="notifica-msg" id="notificaMsg"></div>
        <div class="notifica-btns" id="notificaBtns"></div>
      </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/categorie.js"></script>
  </body>
</html>
